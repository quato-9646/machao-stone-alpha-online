/* Layout concept: a felt table seen from above. Opponents sit on the upper half as two cards,
   the shared info bar (round, dora, wall) crosses the middle, the player's river, hand and
   controls sit at the bottom thumb zone. Rules and settings live in sheets, not on the table. */
:root {
  --bg: #e9ece6; --fg: #19211c; --muted: #5b675f; --panel: #ffffff; --line: #cfd6cc;
  --felt: #1c4f3d; --felt-d: #133a2d; --felt-l: #276149; --felt-ink: #e8f0e6; --felt-mute: #a8c2b3;
  --gold: #e2b23c; --gold-ink: #3b2c00; --danger: #c0392b; --ok: #2f8a4f;
  --tile: #f7f2e3; --tile-2: #ebe2c6; --tile-edge: #c7b88f; --tile-back: #c9792c; --tile-back-2: #9e5a1a;
  --man: #c52f2a; --pin: #1d5ca6; --sou: #2b7a39; --ink: #222a25;
  --serif: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  --sans: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif;
  --twb: clamp(22px, calc((100vw - 56px) / 15.6), 44px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --fg: #e6ede8; --muted: #93a39a; --panel: #18211c; --line: #29352e;
    --felt: #123a2d; --felt-d: #0c2a21; --felt-l: #1a4a39; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411; --fg: #e6ede8; --muted: #93a39a; --panel: #18211c; --line: #29352e;
  --felt: #123a2d; --felt-d: #0c2a21; --felt-l: #1a4a39; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.5; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .tile:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#app { max-width: 1040px; margin: 0 auto; padding-inline: 12px; padding-block: 8px 28px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 6px; }
.brand { font-family: var(--serif); font-weight: 800; font-size: 19px; letter-spacing: .06em; }
.top-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chip-btn.on { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 700; }
.hand-tools .chip-btn { font-size: 14px; font-weight: 600; padding: 6px 14px; }
.hand-tools .chip-btn.on { font-weight: 800; }
.chip-btn:hover { border-color: var(--gold); }

/* ---------- tiles ---------- */
.tile { --tw: var(--twb); width: var(--tw); height: calc(var(--tw) * 1.4); flex: 0 0 auto;
  background: linear-gradient(180deg, var(--tile), var(--tile-2)); border: 1px solid var(--tile-edge);
  border-bottom-width: calc(var(--tw) * .09); border-radius: calc(var(--tw) * .14);
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
  font-family: var(--serif); line-height: 1; color: var(--ink); user-select: none; -webkit-user-select: none;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .35); transition: transform .12s ease; }
.tile .n { font-size: calc(var(--tw) * .56); font-weight: 800; }
.tile .s { font-size: calc(var(--tw) * .29); font-weight: 700; margin-top: calc(var(--tw) * .04); }
.tile.m .n, .tile.m .s { color: var(--man); }
.tile.p .n, .tile.p .s { color: var(--pin); }
.tile.s .n, .tile.s .s { color: var(--sou); }
.tile.h .n { font-size: calc(var(--tw) * .66); }
.tile.h-g .n { color: var(--sou); } .tile.h-r .n { color: var(--man); } .tile.h-w .n { color: #6a7570; }
.tile.f { background: linear-gradient(180deg, #fde8ee, #f4c9d6); }
.tile.f .n { color: #b43a63; font-size: calc(var(--tw) * .62); }
.tile.red .n { color: #e0171c; text-shadow: 0 0 .5px #e0171c; }
.tile.red::after { content: ''; position: absolute; top: 7%; right: 9%; width: calc(var(--tw) * .17); height: calc(var(--tw) * .17); border-radius: 50%; background: #e0171c; }
.tile .pochi { position: absolute; top: 8%; left: 10%; width: calc(var(--tw) * .14); height: calc(var(--tw) * .14); border-radius: 50%; background: #3b4a44; }
.tile .nb { position: absolute; top: 5%; left: 9%; font-size: calc(var(--tw) * .24); font-weight: 800; color: #3b4a44; }
.tile .gb { position: absolute; bottom: 5%; left: 0; right: 0; text-align: center; font-size: calc(var(--tw) * .22); font-weight: 800; font-family: var(--sans); color: #fff; letter-spacing: 0; }
.tile.gem { border-color: var(--gc); background: linear-gradient(180deg, color-mix(in srgb, var(--gc) 22%, var(--tile)), color-mix(in srgb, var(--gc) 42%, var(--tile-2))); box-shadow: 0 0 0 1px var(--gc), 0 1px 2px rgba(0,0,0,.35); }
.tile.gem .gb { background: var(--gc); border-radius: 0 0 calc(var(--tw) * .1) calc(var(--tw) * .1); bottom: 0; padding: 1px 0; }
.g-amethyst { --gc: #2f67d8; } .g-turquoise { --gc: #1fa56a; } .g-kunzite { --gc: #9248c9; }
.g-tourmaline { --gc: #c9a20f; } .g-garnet { --gc: #cc2f35; } .g-ruby { --gc: #e0568f; }
.tile.back { background: repeating-linear-gradient(45deg, var(--tile-back) 0 4px, var(--tile-back-2) 4px 8px); border-color: #7a4713; }
.tile.back * { display: none; }
.tile.sel { transform: translateY(calc(var(--tw) * -.28)); box-shadow: 0 0 0 2px var(--gold), 0 6px 10px rgba(0,0,0,.4); }
.tile.dim { opacity: .38; }
.tile.hot { box-shadow: 0 0 0 2px var(--gold), 0 0 12px var(--gold); }
.tile.lastd { box-shadow: 0 0 0 2px #fff, 0 0 10px #fff; }
.tile.called { opacity: .4; }
.tile.xs { --tw: calc(var(--twb) * .5); } .tile.sm { --tw: calc(var(--twb) * .62); }
.slot-rot { width: calc(var(--twb) * .62 * 1.4); height: calc(var(--twb) * .62 * 1.4); display: inline-flex; align-items: flex-end; justify-content: center; }
.slot-rot .tile { transform: rotate(90deg) translate(0, 14%); transform-origin: center; }

/* ---------- table ---------- */
.table { background: radial-gradient(120% 90% at 50% 0%, var(--felt-l), var(--felt) 55%, var(--felt-d)); color: var(--felt-ink);
  border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--felt-d); position: relative; }
.info { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; background: rgba(0,0,0,.22); border-radius: 12px; padding: 8px 12px; }
.info .round { font-family: var(--serif); font-weight: 800; font-size: 20px; letter-spacing: .08em; }
.info .kv { font-size: 13px; color: var(--felt-mute); }
.info .kv b { color: var(--felt-ink); font-variant-numeric: tabular-nums; font-size: 15px; }
.dora-row { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.dora-row .lbl { font-size: 12px; color: var(--felt-mute); margin-right: 4px; }
.efx { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.efx span { background: rgba(226,178,60,.18); border: 1px solid rgba(226,178,60,.55); color: #f4dc9a; border-radius: 999px; padding: 1px 9px; font-size: 12px; }
.opps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seatbox { background: rgba(0,0,0,.2); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.seatbox.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.phead { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.phead .wind { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--tile); color: var(--ink); font-family: var(--serif); font-weight: 800; font-size: 15px; }
.phead .wind.dealer { background: var(--gold); color: var(--gold-ink); }

.river { display: grid; grid-template-columns: repeat(6, calc(var(--twb) * .62)); gap: 2px; justify-content: start; align-items: end; min-height: calc(var(--twb) * .62 * 1.4); }

.me { gap: 8px; }

.hint .bar { height: 4px; background: rgba(255,255,255,.14); border-radius: 2px; grid-column: 1 / -1; overflow: hidden; }
.hint .bar i { display: block; height: 100%; background: var(--gold); }
.hint small { color: var(--felt-mute); display: block; margin-top: 4px; }
.banner { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 5; }
.banner span { font-family: var(--serif); font-weight: 800; font-size: clamp(34px, 9vw, 64px); color: #fff; letter-spacing: .1em;
  text-shadow: 0 2px 0 #000, 0 0 18px rgba(0,0,0,.6); background: rgba(0,0,0,.45); padding: 4px 28px; border-radius: 14px; animation: pop .9s ease forwards; }
@keyframes pop { 0% { transform: scale(.7); opacity: 0; } 18% { transform: scale(1.06); opacity: 1; } 80% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .banner span { animation: none; } .tile { transition: none; } }

/* ---------- sheets / modals ---------- */
.modal { position: fixed; inset: 0; background: rgba(5, 10, 8, .62); display: grid; place-items: center; z-index: 20; padding: 12px; overflow-y: auto; }
.sheet { background: var(--panel); color: var(--fg); border-radius: 16px; width: min(760px, 100%); max-height: calc(100vh - 24px); overflow-y: auto; padding: 16px 18px; border: 1px solid var(--line); }

.sheet p, .sheet li { color: var(--fg); }
.sheet ul { padding-left: 1.2em; margin: 4px 0; }
.sheet .muted { color: var(--muted); }
.sheet .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.sheet select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
.sheet .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

.res-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 10px 0; }

.res-card .big { font-family: var(--serif); font-size: 21px; font-weight: 800; }
.yaku { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px 14px; margin: 6px 0; padding: 0; list-style: none; }
.yaku li { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--line); }
.yaku li b { font-variant-numeric: tabular-nums; }
.chiplist { font-size: 13px; color: var(--muted); }
table.sc { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 8px; }
table.sc th, table.sc td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--line); }
table.sc th:first-child, table.sc td:first-child { text-align: left; }
.pos { color: var(--ok); font-weight: 700; } .neg { color: var(--danger); font-weight: 700; }
.start { text-align: center; padding: 22px 8px 10px; }
.start h1 { font-family: var(--serif); font-size: clamp(30px, 8vw, 46px); margin: 6px 0; letter-spacing: .1em; }
.start p { color: var(--muted); max-width: 560px; margin: 8px auto; }
.start .tiles { display: flex; justify-content: center; gap: 4px; margin: 14px 0; }
.start .tiles .tile { --tw: clamp(30px, 8vw, 46px); }
.logbox { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin-top: 10px; max-height: 220px; overflow-y: auto; font-size: 13px; }

@media (max-width: 560px) {
  #app { padding-inline: 8px; }
  .opps { grid-template-columns: 1fr; }
  .table { padding: 8px; }
  .info .round { font-size: 17px; }
}
[hidden]{display:none !important}

/* ---------- tile pictures (sprite sheet: 9 columns x 5 rows) ---------- */
.tile.img { background-color: var(--tile); background-image: var(--sprite); background-size: 900% 500%;
  background-position: calc(var(--c) * 12.5%) calc(var(--r) * 25%); background-repeat: no-repeat; }
.tile.img.red::after { display: none; }
.tile.img.gem { background-image: var(--sprite), linear-gradient(color-mix(in srgb, var(--gc) 55%, #fff), color-mix(in srgb, var(--gc) 55%, #fff));
  background-size: 900% 500%, 100% 100%; background-position: calc(var(--c) * 12.5%) calc(var(--r) * 25%), 0 0; background-blend-mode: multiply, normal; }
.tile.img .nb { top: 6%; left: 8%; font-size: calc(var(--tw) * .3); background: #20262a; color: #fff; padding: 0 calc(var(--tw) * .05); border-radius: calc(var(--tw) * .06); }
.tile.il { --tw: 1.05em; display: inline-block; vertical-align: -.3em; margin: 0 1px; border-bottom-width: 1px; border-radius: 2px; box-shadow: 0 0 0 1px var(--tile-edge); }
.tile.il.gem { box-shadow: none; }

  .hand { flex-wrap: wrap; row-gap: calc(var(--twb) * .35); }

  .hand .drawn { margin-left: calc(var(--twb) * .3); }
  .tile.il { --tw: 1.25em; }
}

/* efficiency panel + wild chooser */

/* fixed effect layer: riichi call, ron/tsumo */

.fx span { font-family: var(--serif); font-weight: 800; font-size: clamp(34px, 9vw, 64px); color: #fff; letter-spacing: .1em; text-shadow: 0 2px 0 #000, 0 0 18px rgba(0,0,0,.6);
  background: rgba(0,0,0,.5); padding: 4px 28px; border-radius: 14px; animation: pop 1s ease forwards; }

  background: linear-gradient(180deg, #e8453a, #a3201a); border: 4px solid #ffd9a0; text-shadow: 0 3px 0 #5a0d0a, 0 0 24px rgba(255, 210, 120, .9); animation: slam 1.7s cubic-bezier(.2, .9, .3, 1) forwards; }
.fx.riichi-bg { background: radial-gradient(circle at 50% 50%, rgba(255, 90, 60, .38), rgba(0, 0, 0, .55) 70%); animation: bgflash 1.7s ease forwards; }

@media (prefers-reduced-motion: reduce) { .fx span, .fx.riichi-bg { animation: none; } }

/* simulation / viewing mode */
.simpage { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin: 8px 0; }
.simpage h2, .sheet h2 { font-family: var(--serif); }

.stcard small { color: var(--muted); font-size: 12.5px; } .stcard.on { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--panel)); } .stcard.off { opacity: .5; }
.chip-btn.pick.on { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 700; }

.watchbar .wb-btns { display: flex; gap: 6px; } .watchbar .chip-btn.on { background: var(--gold); color: var(--gold-ink); }

@media (max-width: 560px) { .simt { font-size: 12.5px; } .simt th, .simt td { padding: 4px 5px; } }
.watchbar .chip-btn { color: var(--fg); } .watchbar .chip-btn.on { color: var(--gold-ink); }

#btn-menu { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 700; }

.advice { background: rgba(0,0,0,.3); border-left: 4px solid var(--gold); border-radius: 10px; padding: 8px 10px; font-size: 13px; display: grid; gap: 3px; margin-top: 8px; }
.advice.push { border-left-color: #e0a23a; } .advice.fold { border-left-color: #5aa0e0; }

.ad-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .ad-l { min-width: 4.2em; font-weight: 700; } .advice .tile.il { --tw: 1.9em; }

.waitbox { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: rgba(224, 70, 58, .2); border: 1px solid #e0463a; border-radius: 10px; padding: 6px 10px; }

.wts { display: flex; gap: 8px; flex-wrap: wrap; } .wt { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; } .wt .tile { --tw: calc(var(--twb) * 1.05); }

.wb-n { margin-left: auto; font-size: 12px; color: var(--felt-mute); }
.sheet input[type=number], .simpage input[type=number] { width: 4.5em; font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); text-align: center; }

/* ---- big hand / d20 effects ---- */
.bigfx { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; overflow: hidden; cursor: pointer; background: radial-gradient(circle at 50% 50%, rgba(40, 10, 0, .82), rgba(0, 0, 0, .95) 75%); animation: bfin .25s ease-out both; }
.bigfx.out { opacity: 0; transition: opacity .2s; }
@keyframes bfin { from { opacity: 0; } to { opacity: 1; } }
.bigfx .rays { position: absolute; width: 190vmax; height: 190vmax; left: 50%; top: 50%; margin: -95vmax 0 0 -95vmax; opacity: .55;
  background: repeating-conic-gradient(from 0deg, rgba(255, 214, 90, .55) 0 7deg, transparent 7deg 22deg); animation: bfspin 9s linear infinite;
  -webkit-mask-image: radial-gradient(circle, #000 0, transparent 55%); mask-image: radial-gradient(circle, #000 0, transparent 55%); }
.bigfx .rays.dim { opacity: .3; }
@keyframes bfspin { to { transform: rotate(360deg); } }
.bf-body { position: relative; text-align: center; color: #fff; font-family: var(--serif); text-shadow: 0 3px 0 #000, 0 0 24px rgba(0, 0, 0, .7); padding: 0 16px; }
.bf-who { font-size: clamp(15px, 4.2vw, 24px); letter-spacing: .12em; opacity: .95; animation: bfdrop .5s ease-out both; }
.bf-title { font-size: clamp(56px, 19vw, 150px); font-weight: 800; letter-spacing: .08em; line-height: 1.1; color: #ffe27a; -webkit-text-stroke: 2px #7a3b00; animation: bfslam .75s cubic-bezier(.2, 1.4, .4, 1) .12s both; }
.bigfx.t4 .bf-title { color: #ffd04a; } .bigfx.t5 .bf-title { color: #ff9a3a; } .bigfx.t6 .bf-title { color: #ff5a4a; font-size: clamp(64px, 22vw, 170px); }
.bf-sub { font-size: clamp(16px, 4.6vw, 28px); margin-top: 6px; letter-spacing: .1em; animation: bfdrop .6s ease-out .55s both; }
@keyframes bfdrop { from { transform: translateY(-24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bfslam { 0% { transform: scale(3.2) rotate(-6deg); opacity: 0; } 55% { transform: scale(.94) rotate(1deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
.confetti { position: absolute; inset: 0; pointer-events: none; }
.confetti i { position: absolute; top: -6%; left: var(--x); width: 9px; height: 15px; background: var(--c); border-radius: 2px; transform: rotate(var(--r)); animation: bffall var(--d) linear var(--w) infinite; }
@keyframes bffall { to { transform: translateY(115vh) rotate(calc(var(--r) + 540deg)); } }
.d20 { position: relative; width: clamp(150px, 46vw, 250px); height: clamp(150px, 46vw, 250px); margin: 10px auto; }
.d20 svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .6)); }
.d20 .d-out { fill: #7a2fd0; stroke: #fff; stroke-width: 2.4; stroke-linejoin: round; }
.d20 .d-in { fill: #9a55ee; stroke: #fff; stroke-width: 1.6; stroke-linejoin: round; }
.d20 .d-ln { fill: none; stroke: #fff; stroke-width: 1.4; opacity: .8; }
.d20 .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(48px, 15vw, 82px); font-weight: 800; color: #fff; padding-top: 14%; text-shadow: 0 2px 0 #2a0a55; font-variant-numeric: tabular-nums; }
.d20.rolling { animation: d20roll .45s linear infinite; }

    var raw = fu * Math.pow(2, han + 2);
    var t = tierOf(han, raw);
    if (summer) {
      if (t === 0) { han += 1; raw = fu * Math.pow(2, han + 2); t = tierOf(han, raw); }
      else if (t < 5) t += 1;

  }
  function payments(base, isDealer, tsumo, honba) {
    honba = honba || 0;
    if (!tsumo) return { ron: ceil100(base * (isDealer ? 6 : 4)) + 300 * honba };
    if (isDealer) return { each: ceil100(base * 2) + 100 * honba };
    return { dealer: ceil100(base * 2) + 100 * honba, other: ceil100(base) + 100 * honba };
  }

  // ---------- helpers ----------
  function setTypes(s) {
    if (s.k === 'seq') return [s.t, s.t + 1, s.t + 2];
    return [s.t];
  }
  function allTypesOfForm(sets, pair) {
    var arr = [];
    sets.forEach(function (s) { setTypes(s).forEach(function (t) { arr.push(t); }); });
    if (pair >= 0) arr.push(pair);
    return arr;
  }
  function isChiitoi(c) {

  }
  function isSeqStart(t, num) { return suitOf(t) >= 1 && suitOf(t) <= 2 && numOf(t) === num; }

  // ---------- main ----------
  // ctx fields: tiles, melds, nuki, winTile, tsumo, seatWind, roundWind, dealer, riichi (0|1|2), doubleRiichi, ippatsu,
  //   haitei, houtei, rinshan, chankan, tenhou, chiihou, omoteInds, uraInds, score, flip, rng, expect, openRiichiYakuman
  function evaluateWin(ctx) {
    var tiles = ctx.tiles, melds = ctx.melds || [], fixed = melds.length;
    var c = countsOf(tiles);
    var meldTiles = [];
    melds.forEach(function (m) { m.tiles.forEach(function (t) { meldTiles.push(t); }); });
    var all = tiles.concat(meldTiles);
    var nuki = ctx.nuki || [];
    var allCounts = countsOf(all);
    var menzen = melds.every(function (m) { return m.kind === 'ankan'; });
    var winT = ctx.winTile.t;
    var riichi = ctx.riichi | 0;
    var omote = ctx.omoteInds || [], ura = riichi ? (ctx.uraInds || []) : [];

    // ----- effects (flowers / gems owned or on indicators) -----
    var fl = { 34: false, 35: false, 36: false, 37: false };
    nuki.forEach(function (t) { if (t.t >= 34) fl[t.t] = true; });
    omote.concat(ura).forEach(function (t) { if (t.t >= 34) fl[t.t] = true; });
    var gemOwned = {}, gemEff = {};
    all.concat(nuki).forEach(function (t) { if (t.gem) { gemOwned[t.gem] = true; gemEff[t.gem] = true; } });
    omote.concat(ura).forEach(function (t) { if (t.gem) gemEff[t.gem] = true; });
    var summer = !!fl[35];

    // ----- dora -----
    var typeCounts = new Int8Array(34);
    for (var i = 0; i < 34; i++) typeCounts[i] = allCounts[i];
    nuki.forEach(function (t) { if (t.t < 34) typeCounts[t.t]++; });
    function hitsFor(inds) {
      var h = 0;
      inds.forEach(function (ind) {
        if (ind.t >= 34) { var mx = 0; for (var k = 0; k < 34; k++) if (typeCounts[k] > mx) mx = typeCounts[k]; h += mx; }
        else h += typeCounts[nextDora(ind.t)];
      });
      return h;
    }
    var doraOmote = hitsFor(omote), doraUra = riichi ? hitsFor(ura) : 0;
    var nukiN = 0, reds = 0, gems5 = 0;
    all.concat(nuki).forEach(function (t) {
      if (t.t === 30) nukiN++;
      if (t.red && t.t !== 30) reds++;          // a red / gem 5m is already a nuki-dora: +1 han only
      if (t.gem && t.t !== 30) gems5++;
    });
    var doraHan = doraOmote + doraUra + nukiN + reds + gems5;

    // ----- candidate forms -----
    var best = null;
    function consider(r) {
      if (!r) return;
      var han = r.yakuHan + doraHan;
      var fu = r.fu;
      var bp = calcBase(han, fu, r.yakuman.length > 0, summer);
      var key = bp.base * 1000 + han;
      if (!best || key > best.key) best = { key: key, r: r, han: han, fu: fu, bp: bp };
    }

    if (fixed === 0 && MJ.shantenKokushi(c) === -1) {
      consider({ yaku: [], yakuman: [c[winT] === 2 ? '国士無双十三面待ち' : '国士無双'], yakuHan: 0, fu: 30, form: { type: 'kokushi' } });
    }
    if (fixed === 0 && isChiitoi(c)) consider(evalChiitoi());
    var dec = decompose(c, 4 - fixed);
    for (var di = 0; di < dec.length; di++) {
      var d = dec[di];
      var seen = {};
      var placements = [];
      if (d.pair === winT) placements.push({ w: 'tanki', i: -1 });
      for (var si = 0; si < d.sets.length; si++) {
        var s = d.sets[si];
        if (s.k === 'tri') { if (s.t === winT && !seen['t' + s.t]) { seen['t' + s.t] = 1; placements.push({ w: 'shanpon', i: si }); } }
        else if (winT >= s.t && winT <= s.t + 2) {
          var w;
          if (winT === s.t + 1) w = 'kanchan';
          else if (winT === s.t) w = numOf(s.t) === 7 ? 'penchan' : 'ryanmen';
          else w = numOf(s.t) === 1 ? 'penchan' : 'ryanmen';
          var key = 's' + s.t + w;
          if (!seen[key]) { seen[key] = 1; placements.push({ w: w, i: si }); }
        }
      }
      for (var pi = 0; pi < placements.length; pi++) consider(evalStd(d, placements[pi]));
    }
    if (!best) return null;

    var r = best.r;
    var yakumanFlag = r.yakuman.length > 0;
    var yakuList = r.yaku.slice();
    var yakumanNames = r.yakuman.slice();
    var openRiichiYakuman = !!ctx.openRiichiYakuman;
    if (!yakumanFlag && r.yakuHan === 0) return null; // no yaku
    var bp = best.bp;
    if (openRiichiYakuman && !yakumanFlag) {
      bp = { base: 8000, tier: '役満', t: 6 }; yakumanFlag = true; yakumanNames.push('オープンリーチ放銃');
    }
    var res = {
      valid: true, han: best.han, fu: best.fu, yakuHan: r.yakuHan, yaku: yakuList, yakuman: yakumanNames,
      isYakuman: yakumanFlag, tier: bp.tier, tierN: bp.t, base: bp.base, summer: summer,
      dora: { omote: doraOmote, ura: doraUra, nuki: nukiN, red: reds, gem: gems5 },
      form: r.form, menzen: menzen, winT: winT
    };
    if (summer && !yakumanFlag) res.summerNote = true;
    res.chips = computeChips(ctx, r.form, { all: all, nuki: nuki, allCounts: allCounts, fl: fl, gemOwned: gemOwned, gemEff: gemEff,
      doraUra: doraUra, riichi: riichi, omote: omote, ura: ura, yakuNames: yakuList.map(function (y) { return y.n; }), yakuman: r.yakuman.length > 0,
      kazoe: (!yakumanFlag && bp.t === 5) ? (tierOf(best.han, 0) >= 5 ? 'pure' : 'summer') : null });   // the open-riichi payment 'yakuman' gets no chips
    return res;

    // ----- inner evaluators -----
    function yakuhaiCount(t) {
      var n = 0;
      if (t >= 31 && t <= 33) n = 1;
      else {
        if (t === ctx.seatWind) n++;
        if (t === ctx.roundWind) n++;
      }
      return n;
    }
    function commonYaku(Y) {
      if (riichi === 1) Y.push(['立直', 1]);
      else if (riichi === 2) Y.push(['オープンリーチ', 2]);
      if (riichi && ctx.doubleRiichi) Y.push(['ダブル立直', 1]);
      if (riichi && ctx.ippatsu) Y.push(['一発', 1]);
      if ((menzen || riichi) && ctx.tsumo) Y.push(['門前清自摸和', 1]);   // a riichi hand with open melds still gets the tsumo yaku
      if (ctx.haitei && ctx.tsumo) Y.push(['海底摸月', 1]);
      if (ctx.houtei && !ctx.tsumo) Y.push(['河底撈魚', 1]);
      if (ctx.rinshan && ctx.tsumo) Y.push(['嶺上開花', 1]);
      if (ctx.chankan && !ctx.tsumo) Y.push(['搶槓', 1]);
    }
    function sumHan(Y) { var h = 0; Y.forEach(function (y) { h += y[1]; }); return h; }
    function pack(Y, YM, fu, form) {
      return { yaku: Y.map(function (y) { return { n: y[0], h: y[1] }; }), yakuman: YM, yakuHan: sumHan(Y), fu: fu, form: form };
    }
    function topYakuman(YM) {
      if (ctx.tenhou) YM.push('天和');
      if (ctx.chiihou) YM.push('地和');
    }

    function evalChiitoi() {
      var Y = [], YM = [];
      topYakuman(YM);
      var allT = [];
      for (var t = 0; t < 34; t++) { if (c[t] === 2 || c[t] === 4) allT.push(t); if (c[t] === 4) allT.push(t); }
      if (allT.every(function (t) { return isHonor(t); })) YM.push('字一色');
      if (YM.length) return pack([], YM, 25, { type: 'chiitoi', pairs: allT });
      commonYaku(Y);
      Y.push(['七対子', 2]);
      if (allT.every(function (t) { return !isYaochu(t); })) Y.push(['断幺九', 1]);
      if (allT.every(function (t) { return isYaochu(t); })) Y.push(['混老頭', 2]);
      var suits = {}, hasHonor = false;
      allT.forEach(function (t) { if (isHonor(t)) hasHonor = true; else suits[suitOf(t)] = 1; });
      var ns = Object.keys(suits).length;
      if (ns === 1 && !hasHonor) Y.push(['清一色', 6]);
      else if (ns <= 1 && hasHonor && ns === 1) Y.push(['混一色', 3]);
      return pack(Y, [], 25, { type: 'chiitoi', pairs: allT });
    }

    function evalStd(d, pl) {
      var sets = d.sets.map(function (s, idx) {
        var conc = true;
        if (pl.i === idx && s.k === 'tri' && !ctx.tsumo) conc = false;
        return { k: s.k, t: s.t, open: !conc, conc: conc };
      });
      melds.forEach(function (m) {
        var t0 = m.tiles[0].t;
        if (m.kind === 'pon') sets.push({ k: 'tri', t: t0, open: true, conc: false });
        else if (m.kind === 'chi') {

        }
        else if (m.kind === 'ankan') sets.push({ k: 'kan', t: t0, open: false, conc: true });
        else sets.push({ k: 'kan', t: t0, open: true, conc: false });
      });
      var pair = d.pair;
      var YM = [];
      topYakuman(YM);
      var nTri = 0, nConc = 0, nKan = 0, nSeq = 0, i;
      sets.forEach(function (s) {
        if (s.k === 'seq') nSeq++; else { nTri++; if (s.conc) nConc++; if (s.k === 'kan') nKan++; }
      });
      var types = allTypesOfForm(sets, pair);
      var allHonor = types.every(function (t) { return isHonor(t); });
      var allTerm = types.every(function (t) { return isTerminal(t); });
      var allGreen = types.every(function (t) { return GREEN[t]; });
      // pair/triplet types
      var dragons = 0, dragonPair = (pair >= 31 && pair <= 33), winds = 0, windPair = (pair >= 27 && pair <= 30);
      sets.forEach(function (s) { if (s.k !== 'seq') { if (s.t >= 31 && s.t <= 33) dragons++; else if (s.t >= 27 && s.t <= 30) winds++; } });
      if (dragons === 3) YM.push('大三元');
      if (winds === 4) YM.push('大四喜'); else if (winds === 3 && windPair) YM.push('小四喜');
      if (allHonor) YM.push('字一色');
      if (allGreen) YM.push('緑一色');
      if (allTerm && nSeq === 0) YM.push('清老頭');
      if (nConc === 4 && menzen) YM.push('四暗刻');
      if (nKan === 4) YM.push('四槓子');
      if (menzen) {
        var suit = -1, one = true;
        types.forEach(function (t) { var s = suitOf(t); if (s === 3 || s === 0) one = false; else if (suit < 0) suit = s; else if (suit !== s) one = false; });
        if (one && suit > 0) {
          var base = suit === 1 ? 9 : 18, ok = true, extra = 0;
          for (i = 0; i < 9; i++) {
            var need = (i === 0 || i === 8) ? 3 : 1;
            if (allCounts[base + i] < need) { ok = false; break; }
          }
          if (ok) YM.push('九蓮宝燈');
        }
      }
      if (YM.length) return pack([], YM, 30, { type: 'std', sets: sets, pair: pair, wait: pl.w });

      var Y = [];
      commonYaku(Y);
      // pinfu
      var pairYh = yakuhaiCount(pair);
      var isPinfu = menzen && nSeq === 4 && pairYh === 0 && pl.w === 'ryanmen';
      if (isPinfu) Y.push(['平和', 1]);
      // tanyao
      if (types.every(function (t) { return !isYaochu(t); })) Y.push(['断幺九', 1]);
      // iipeikou / ryanpeikou
      if (menzen) {
        var seqCount = {};
        sets.forEach(function (s) { if (s.k === 'seq') seqCount[s.t] = (seqCount[s.t] || 0) + 1; });
        var pe = 0;
        for (var k in seqCount) pe += Math.floor(seqCount[k] / 2);
        if (pe >= 2) Y.push(['二盃口', 3]); else if (pe === 1) Y.push(['一盃口', 1]);
      }
      // yakuhai
      sets.forEach(function (s) {
        if (s.k === 'seq') return;
        if (s.t === 31) Y.push(['役牌 白', 1]);
        else if (s.t === 32) Y.push(['役牌 發', 1]);
        else if (s.t === 33) Y.push(['役牌 中', 1]);
        else {
          if (s.t === ctx.seatWind) Y.push(['役牌 自風', 1]);
          if (s.t === ctx.roundWind) Y.push(['役牌 場風', 1]);
        }
      });
      // chanta / junchan / honroutou
      var allHaveYao = sets.every(function (s) {
        if (s.k === 'seq') return isYaochu(s.t) || isYaochu(s.t + 2);
        return isYaochu(s.t);
      }) && isYaochu(pair);
      var hasHonorTile = types.some(function (t) { return isHonor(t); });
      if (allHaveYao) {
        if (nSeq === 0) Y.push(['混老頭', 2]);
        else if (hasHonorTile) Y.push(['混全帯幺九', menzen ? 4 : 2]);
        else Y.push(['純全帯幺九', menzen ? 6 : 4]);

      [9, 18].forEach(function (b) {

      });
      // sanshoku doukou
      var triSet = {};
      sets.forEach(function (s) { if (s.k !== 'seq') triSet[s.t] = 1; });
      if ((triSet[0] && triSet[9] && triSet[18]) || (triSet[8] && triSet[17] && triSet[26])) Y.push(['三色同刻', 2]);
      // toitoi
      if (nSeq === 0) Y.push(['対々和', 2]);
      if (nConc === 3) Y.push(['三暗刻', 2]);
      if (nKan === 3) Y.push(['三槓子', 2]);
      if (dragons === 2 && dragonPair) Y.push(['小三元', 2]);
      // honitsu / chinitsu
      var suitsSet = {}, nSuits = 0;
      types.forEach(function (t) { var s = suitOf(t); if (s !== 3 && !suitsSet[s]) { suitsSet[s] = 1; nSuits++; } });
      if (nSuits === 1) {

        else Y.push(['清一色', menzen ? 6 : 5]);
      }
      // fu
      var fu;
      if (isPinfu && ctx.tsumo) fu = 20;
      else {
        fu = 20;
        if (menzen && !ctx.tsumo) fu += 10;
        if (ctx.tsumo) fu += 2;
        if (pl.w === 'kanchan' || pl.w === 'penchan' || pl.w === 'tanki') fu += 2;
        fu += yakuhaiCount(pair) * 2;
        sets.forEach(function (s) {
          if (s.k === 'seq') return;
          var f = isYaochu(s.t) ? 4 : 2;
          if (s.conc) f *= 2;
          if (s.k === 'kan') f *= 4;
          fu += f;
        });
        if (fu === 20 && !menzen) fu = 30; // open pinfu-shape
        if (fu === 20 && menzen && !isPinfu) fu = 30; // safety
        fu = Math.ceil(fu / 10) * 10;
      }
      return pack(Y, [], fu, { type: 'std', sets: sets, pair: pair, wait: pl.w });
    }
  }

  // ---------- chips ----------
  function computeChips(ctx, form, e) {
    var D = mkDice(ctx);
    var items = [];
    var total = 0;
    function add(label, n) { if (n) { items.push({ label: label, n: n }); total += n; } }
    var riichi = e.riichi;
    var all = e.all, nuki = e.nuki;
    if (riichi && ctx.ippatsu) add('一発', 1);
    var reds = 0;
    all.concat(nuki).forEach(function (t) { if (t.red) reds++; });
    add('赤ドラ', reds);
    // red tiles showing as dora / ura-dora indicators are usable by everyone, like gems and flowers
    var indRed = { 13: false, 22: false, 30: false }, nIndRed = 0;
    e.omote.concat(e.ura || []).forEach(function (t) { if (t.red) { nIndRed++; if (t.t in indRed) indRed[t.t] = true; } });
    add('赤(表示牌)', nIndRed);
    add('裏ドラ', e.doraUra);
    // gem base
    all.concat(nuki).forEach(function (t) {
      if (t.gem && GEM_BASE[t.gem]) add(MJ.GEMS[t.gem].name + '(祝儀)', GEM_BASE[t.gem]);
    });
    // gems showing as dora / ura-dora indicators give their own chips too (like red indicators)
    e.omote.concat(e.ura || []).forEach(function (t) {
      if (t.gem && GEM_BASE[t.gem]) add(MJ.GEMS[t.gem].name + '(表示牌・祝儀)', GEM_BASE[t.gem]);
    });
    // gem effects
    var g = e.gemEff;
    if (g.kunzite) {
      var yc = 0; all.concat(nuki).forEach(function (t) { if (isYaochu(t.t)) yc++; });
      add('クンツァイト(幺九牌' + yc + '枚・抜き北含む)', yc);
    }
    if (g.tourmaline) {
      var sc = Math.abs(ctx.score | 0), best = 0;
      if (sc === 0) best = 5;
      else String(sc).split('').forEach(function (ch) { var v = +ch; if (v > best) best = v; });
      add('トルマリン(点数の数字)', best);
    }
    if (g.garnet) {
      // every dora indicator on the table counts, including the new ones revealed by kans
      // if any omote indicator is a flower tile, the garnet is worth nothing
      var v = 0, flowerInd = false;
      e.omote.forEach(function (ind) {
        if (ind.t >= 34) flowerInd = true;
        else { var dt = nextDora(ind.t); v += isHonor(dt) ? 3 : numOf(dt); }
      });
      if (flowerInd) v = 0;
      add(flowerInd ? 'ガーネット(表示牌に花牌: 0枚)' : 'ガーネット(ドラの数)', v);
    }
    if (g.ruby) {
      var wn = ctx.winTile.t, rv = isHonor(wn) ? 1 : numOf(wn);
      add('ルビー(和了牌の数)', rv);
    }
    // flowers
    if (e.fl[34]) {
      var sp = riichi ? D.max() : D.min();
      add(riichi ? '春(大きい目)' : '春(小さい目)', sp);
    }
    if (e.fl[37] && ctx.flip) {
      var hits = 0, round = 0;
      for (var si = 0; si < ctx.flip.length; si++) {
        var st = ctx.flip[si], h = 0;
        var cand = riichi ? st : [st[0]];
        cand.forEach(function (t) { if (t && t.t < 34 && e.allCounts[t.t] > 0) h++; });
        hits += h;
        if (h === 0) break;
      }
      add('冬(めくり' + hits + '枚的中)', hits);
    }
    // chips attached to particular yaku
    var YCHIP = { '混全帯幺九': 1, '純全帯幺九': 3, '混老頭': 5, '小三元': 5, '二盃口': 5, '嶺上開花': 1, '搶槓': 10, '三色同刻': 10, '三槓子': 10 };
    (e.yakuNames || []).forEach(function (n) { if (YCHIP[n]) add(n + '(祝儀)', YCHIP[n]); });
    // 四花: all four flowers (own nuki + indicators); 四北: all four 5萬 (nuki / in hand / indicators)
    if (e.fl[34] && e.fl[35] && e.fl[36] && e.fl[37]) add('四花(花牌4枚そろい)', 5);
    var n5m = 0;
    all.concat(nuki, e.omote, e.ura || []).forEach(function (t) { if (t.t === 30) n5m++; });
    if (n5m >= 4) add('四北(5萬4枚そろい)', 3);
    // pochi haku
    // the d20 is rolled only when the winning tile itself is a pochi haku, drawn by tsumo after riichi
    // either right away (ippatsu) or from the dead wall (rinshan); never just for holding a pochi
    if (ctx.winTile && ctx.winTile.pochi && ctx.tsumo && riichi && (ctx.ippatsu || ctx.rinshan)) {
      add('ぽっち白(20面サイコロ)', D.d20());
    }
    // all star
    var hasR5p = false, hasR5s = false, hasR5m = false;
    all.forEach(function (t) { if (t.red && t.t === 13) hasR5p = true; if (t.red && t.t === 22) hasR5s = true; });
    hasR5p = hasR5p || indRed[13]; hasR5s = hasR5s || indRed[22]; hasR5m = indRed[30];   // indicators count too
    all.concat(nuki).forEach(function (t) { if (t.red && t.t === 30) hasR5m = true; });   // red 5m counts in hand or nuki'd
    if (hasR5p && hasR5s && hasR5m) add('オールスター(サイコロ2個の合計)', D.sum());
    // 1m / 9m
    if (form) {
      var cnt1 = 0;
      if (form.type === 'chiitoi') {
        var quads = 0; for (var qt = 0; qt < 34; qt++) if (e.allCounts[qt] === 4) quads++;

  function cutinVoice(id) {   // the recorded voice lines; falls back to speech synthesis if playback is blocked
    if (S.fast || !settings.sound) return true;
    try { var a = new Audio(CUTIN_SND[id]); a.volume = 1; var p = a.play(); if (p && p.catch) p.catch(function () { }); return true; } catch (e) { return false; }
  }
  function cutinKind(gain) { for (var i = 0; i < CUTINS.length; i++) if (gain >= CUTINS[i].min) return CUTINS[i]; return null; }
  function cutinFx(w, c, gain, first) {
    var html = '<div class="ci-bg"></div><div class="ci-stripes"></div><div class="ci-flash"></div>' + (c.id === 'rainbow' && !REDUCED ? confettiHTML(60) : '') +
      '<div class="ci-body"><div class="ci-who">' + esc(NAMES[w.seat]) + (w.tsumo ? ' ツモ' : ' ロン') + '</div><div class="ci-gain">+' + gain + '<small>枚</small></div>' +
      '<div class="ci-line">' + esc(c.line) + '</div>' + (first ? '<div class="ci-ach">🏆 実績解除 「' + esc(c.name) + '」</div>' : '') + '</div>';
    sfx('big'); if (!cutinVoice(c.id)) speak(c.line);
    return fxOverlay('cutin ' + c.id, html, REDUCED ? 1600 : (c.id === 'rainbow' ? 3800 : 3200));
  }
  function bigFx(res) {
    if (S.fast || !res || !res.wins) return Promise.resolve();
    var q = [];
    res.wins.forEach(function (w) {
      var ev = w.ev; if (!ev) return;
      if (ev.tierN >= 4) q.push(function () { return tierFx(w); });
      var gain = w.chipsD ? w.chipsD[w.seat] : 0, ck = cutinKind(gain);
      if (ck) {
        var first = false;
        if (w.seat === 0) { first = !(profile[ck.key] > 0); tally(ck.key, 1); }
        q.push(function () { return cutinFx(w, ck, gain, first); });
      }
      ((ev.chips && ev.chips.rolls) || []).forEach(function (r) { if (r[2] === 3) q.push(function () { return d20Fx(w, r[0]); }); });
    });
    return q.reduce(function (p, f) { return p.then(f); }, Promise.resolve());
  }

  // ---------- events ----------
  function onEvent(name, d) {
    var h = game.h;
    if (name === 'discard') {
      logLine(pname(d.seat) + ': 打 ' + MJ.typeName(d.tile.t) + (d.tile.red ? '(赤)' : d.tile.gem ? '(' + MJ.GEMS[d.tile.gem].name + ')' : ''));
    } else if (name === 'riichi') {
      logLine(pname(d.seat) + ': ' + (d.open ? 'オープンリーチ' : d.double ? 'ダブルリーチ' : 'リーチ'));
      var rt = d.open ? 'オープンリーチ' : d.double ? 'ダブルリーチ' : 'リーチ';
      flash(rt + '！', 'riichi'); sfx('riichi'); speak(rt);
    } else if (name === 'flower') {
      logLine(pname(d.seat) + ': ' + FLOWER[d.tile.t] + ' を抜き');
    } else if (name === 'nuki') {
      logLine(pname(d.seat) + ': 北(5萬)抜き');
    } else if (name === 'meld') {
      var k = ({ pon: 'ポン', chi: 'チー', minkan: 'カン' })[d.meld.kind];
      logLine(pname(d.seat) + ': ' + k); flash(k); sfx('call'); speak(k);
    } else if (name === 'ankan' || name === 'kakan') {
      logLine(pname(d.seat) + ': カン'); flash('カン');
    } else if (name === 'dora') {
      logLine('新ドラ表示牌: ' + MJ.typeName(d.ind.t));
    }
  }
